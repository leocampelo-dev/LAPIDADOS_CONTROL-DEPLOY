<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapidados Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo_lapidados_control.svg" type="image/svg+xml" sizes="any">
<link rel="shortcut icon" href="assets/logo_lapidados_control.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/logo_lapidados_control.svg" sizes="any">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E85D04">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#E85D04;--or1:#FFF0E6;--or2:#FFD3B0;--or4:#E85D04;--or5:#C4470A;--or6:#8C3208;
  --ink:#0F0F0F;--ink2:#3D3D3D;--ink3:#717171;--ink4:#A0A0A0;--ink5:#C8C8C8;--ink6:#EBEBEB;--ink7:#F7F7F7;
  --w:#fff;--r1:#FFF1F0;--r4:#E84040;--r6:#9B1C1C;
  --y1:#FFFBEB;--y4:#D97706;--y6:#78350F;
  --g1:#F0FDF4;--g4:#16A34A;--g6:#14532D;
  --b1:#EFF6FF;--b4:#2563EB;--b6:#1E3A8A;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --max:1120px;--pad:32px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--ink7);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:'Plus Jakarta Sans',sans-serif}

/* ── AUTH / SETUP SCREENS ── */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink7)}
.auth-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-xl);padding:40px;width:100%;max-width:420px}
.auth-logo{display:flex;align-items:center;gap:0px;margin-bottom:12px}
.auth-mark{width:100px;height:100x;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-brand{font-size:22px;font-weight:800;letter-spacing:-.3px}
.auth-brand span{color:var(--ink3);font-weight:500;font-size:15px;margin-left:4px}
.auth-title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--ink3);margin-bottom:28px;line-height:1.5}
.auth-tabs{display:flex;border-bottom:1.5px solid var(--ink6);margin-bottom:24px}
.auth-tab{flex:1;padding:9px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s}
.auth-tab.on{color:var(--or4);border-bottom-color:var(--or4)}
.auth-err{background:var(--r1);color:var(--r6);padding:10px 14px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:16px;border:1px solid #fca5a5}
.auth-ok{background:var(--g1);color:var(--g6);padding:10px 14px;border-radius:9px;font-size:13px;font-weight:500;margin-bottom:16px;border:1px solid #86efac}
.auth-step{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--ink7);border-radius:9px;border:1px solid var(--ink6);margin-bottom:8px;font-size:13px}
.auth-step-n{width:20px;height:20px;border-radius:50%;background:var(--or4);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── TOPBAR ── */
.topbar{background:var(--ink);height: 70px;position:sticky;top:0;z-index:100;display:flex;align-items:center}
.topbar-inner{display:flex;align-items:center;height:100%;justify-content:center;width:calc(100% - 65px);margin-left:65px}
.topbar-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:var(--max);padding:0 28px;gap:12px}
.logo{height:40px; width:auto;display:flex;align-items:center;gap:0;flex-shrink:0;cursor:pointer;padding:0;border-radius:0;transition:background .15s;max-width:200px;margin-left:0}
.logo:hover{background:none}
.logo-mark{width:140px;height:40px;border-radius:0;overflow:hidden;display:flex;align-items:center;justify-content:flex-start;flex-shrink:0;background:transparent;position:relative}
.logo-mark img{width:100%;height:100%;object-fit:contain;object-position:left}
.logo-text{display:none}
.logo-sub{display:none}
.topbar-right{display:flex;align-items:center;gap:6px;}
.date-chip{color:#666;font-size:11px;padding:4px 8px;border-radius:5px;border:1px solid #2a2a2a;font-weight:500}
.user-btn{background:rgba(255,255,255,0.08);border:1px solid #333;color:#aaa;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.user-btn:hover{background:rgba(255,255,255,0.15);color:#fff}

/* ── SIDEBAR LAYOUT ── */
.app-body{position:relative;min-height:calc(100vh - 70px)}
.sidebar{width:220px;background:var(--ink);position:fixed;left:0;top:70px;height:calc(100vh - 70px);overflow:hidden;display:flex;flex-direction:column;transition:width .2s cubic-bezier(.4,0,.2,1);border-right:1px solid #1c1c1c;z-index:30}
.sidebar.cl{width:65px}
.snav-header{display:flex;align-items:center;justify-content:flex-end;padding:8px 8px 0}
.sidebar.cl .snav-header{justify-content:center}
.snav-toggle{display:flex;align-items:center;justify-content:center;width:42px;height:42px;min-width:42px;min-height:42px;border-radius:9px;border:1px solid #2a2a2a;background:none;color:#555;cursor:pointer;transition:all .15s;font-size:13px;flex-shrink:0;padding:0}
.sidebar.cl .snav-toggle{margin:0 auto}
.snav-toggle:hover{color:#ccc;border-color:#444;background:rgba(255,255,255,0.08)}
.snav-toggle img{display:block;width:16px;height:16px;object-fit:contain}
.snav-list{padding:6px 6px;flex:1;overflow-y:auto;overflow-x:hidden}
.snav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:none;background:none;color:#777;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;width:100%;text-align:left;white-space:nowrap;margin-bottom:2px}
.sidebar.cl .snav-item{justify-content:center;gap:0;padding:8px 0}
.snav-item:hover{color:#fff;background:rgba(255,255,255,0.08)}
.snav-item.on{color:#FF8C42;background:rgba(232,93,4,0.12)}
.snav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;display:flex;align-items:center;justify-content:center}
.snav-lbl{transition:opacity .15s;overflow:hidden;white-space:nowrap}
.sidebar.cl .snav-lbl{opacity:0;width:0;pointer-events:none}
.snav-badge{background:#E84040;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:20px;min-width:18px;text-align:center;flex-shrink:0;margin-left:auto}
.sidebar.cl .snav-badge{display:none}
.main-content{flex:1;min-width:0;overflow-x:hidden;padding-left:65px}

/* ── MAIN LAYOUT ── */
.main{max-width:var(--max);margin:0 auto;padding:28px var(--pad)}

/* ── HOME PAGE ── */
.home-greeting{background:linear-gradient(135deg,var(--or4) 0%,#C4470A 100%);border-radius:var(--radius-xl);padding:28px 28px;margin-bottom:22px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}
.home-greeting-left h2{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.home-greeting-left p{font-size:13px;opacity:.8}
.home-greeting-av{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,0.3)}
.home-greeting-av img{width:100%;height:100%;object-fit:cover}
.home-qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.home-qa-btn{background:var(--w);border:1.5px solid var(--ink6);border-radius:var(--radius-lg);padding:14px 16px;cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:10px}
.home-qa-btn:hover{border-color:var(--or4);box-shadow:0 2px 12px rgba(232,93,4,0.12)}
.home-qa-icon{width:32px;height:32px;border-radius:9px;background:var(--or1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.home-qa-lbl{font-size:12px;font-weight:700;color:var(--ink2)}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.pg-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.pg-sub{font-size:13px;color:var(--ink3);margin-top:3px}

/* ── LOADING ── */
.loading{text-align:center;padding:80px;color:var(--ink3)}
.spinner{width:32px;height:32px;border:3px solid var(--ink6);border-top-color:var(--or4);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);padding:18px 20px;cursor:default;transition:box-shadow .2s;position:relative;overflow:hidden}
.kpi:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:15px;font-weight:700}
.kpi-v{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1;margin-bottom:5px}
.kpi-l{font-size:12px;color:var(--ink3);font-weight:500;display:flex;align-items:center;gap:5px}
.kpi-d{font-size:11px;color:var(--ink4);margin-top:4px}
.kpi.or .kpi-icon{background:var(--or1);color:var(--or4)}.kpi.or .kpi-v{color:var(--or4)}
.kpi.re .kpi-icon{background:var(--r1);color:var(--r4)}.kpi.re .kpi-v{color:var(--r4)}
.kpi.gr .kpi-icon{background:var(--g1);color:var(--g4)}.kpi.gr .kpi-v{color:var(--g4)}
.kpi.bl .kpi-icon{background:var(--b1);color:var(--b4)}.kpi.bl .kpi-v{color:var(--b4)}
.kpi.ye .kpi-icon{background:var(--y1);color:var(--y4)}.kpi.ye .kpi-v{color:var(--y4)}

/* ── TOOLTIP ── */
.tip-wrap{position:relative;display:inline-flex}
.tip-box{position:absolute;bottom:calc(100% + 10px);left:0;transform:none;background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:10px 14px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .18s;z-index:999;white-space:normal;text-align:left;width:280px;line-height:1.6}
.tip-box::after{content:'';position:absolute;top:100%;left:14px;transform:none;border:5px solid transparent;border-top-color:var(--ink)}
.tip-wrap:hover .tip-box{opacity:1}
.info-dot{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--ink6);color:var(--ink3);font-size:9px;font-weight:700;cursor:help;flex-shrink:0}
.info-dot:hover{background:var(--ink5)}

/* ── CARDS ── */
.card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg)}
.card-head{padding:16px 20px 14px;border-bottom:1px solid var(--ink6);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700;color:var(--ink)}
.card-body{padding:16px 20px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.4}
.b-ok{background:var(--g1);color:var(--g6)}.b-warn{background:var(--y1);color:var(--y6)}
.b-crit{background:var(--r1);color:var(--r6)}.b-danger{background:var(--r4);color:#fff}
.b-muted{background:var(--ink6);color:var(--ink3)}.b-brand{background:var(--or1);color:var(--or6)}
.b-info{background:var(--b1);color:var(--b6)}.b-paid{background:var(--g1);color:var(--g6)}
.b-pending{background:var(--r1);color:var(--r6)}.b-partial{background:var(--y1);color:var(--y6)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1.5px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--or4);color:#fff;border-color:var(--or4)}.btn-primary:hover{background:var(--or5)}
.btn-ghost{background:var(--w);border-color:var(--ink5);color:var(--ink2)}.btn-ghost:hover{background:var(--ink7)}
.btn-del{background:var(--r1);border-color:#fca5a5;color:var(--r4)}.btn-del:hover{background:#fee2e2}
.btn-info{background:var(--b1);border-color:#93c5fd;color:var(--b4)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px;border-width:1px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgf{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:5px}
.flb{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.fi{padding:9px 12px;border:1.5px solid var(--ink5);border-radius:9px;font-size:13px;outline:none;transition:border .15s;background:var(--w);color:var(--ink)}
.fi:focus{border-color:var(--or4);box-shadow:0 0 0 3px rgba(232,93,4,0.1)}
.fi[readonly]{background:var(--ink7);color:var(--ink3);cursor:default;-webkit-user-select:none;user-select:none}

/* ── TOOLBAR / TABLE ── */
.tbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.tbar-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srch{position:relative}
.srch input{padding:9px 12px 9px 34px;border:1.5px solid var(--ink5);border-radius:9px;width:220px;outline:none;font-size:13px;background:var(--w);color:var(--ink);transition:border .15s}
.srch input:focus{border-color:var(--or4)}
.srch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink4);font-size:14px;pointer-events:none}
.fsel{padding:9px 11px;border:1.5px solid var(--ink5);border-radius:9px;font-size:13px;outline:none;background:var(--w);cursor:pointer;color:var(--ink);font-weight:500}
.fsel:focus{border-color:var(--or4)}
.tw{overflow-x:auto;background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--ink7)}
th{padding:11px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--ink6)}
td{padding:12px 16px;border-top:1px solid var(--ink6);vertical-align:middle;word-break:break-word}
tr:hover td{background:#fafafa}
.td-n{font-weight:600;color:var(--ink)}
.td-s{color:var(--ink3);font-size:12px;margin-top:1px}
.td-m{color:var(--ink3)}
.td-id{font-family:monospace;font-size:11px;background:var(--ink7);color:var(--ink3);padding:2px 6px;border-radius:5px}
.td-act{display:flex;gap:5px;justify-content:flex-end}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(15,15,15,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.mdl{background:var(--w);border-radius:var(--radius-xl);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border:1px solid var(--ink6)}
.mdl-lg{max-width:720px}
.mdl-top{padding:20px 24px 16px;border-bottom:1px solid var(--ink6);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--w);z-index:1;border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.mdl-ttl{font-size:16px;font-weight:800;letter-spacing:-.3px}
.mdl-sub{font-size:12px;color:var(--ink3);margin-top:3px}
.mdl-x{background:var(--ink7);border:none;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.mdl-x:hover{background:var(--ink6)}
.mdl-bdy{padding:22px 24px}
.mdl-ft{padding:14px 24px;border-top:1px solid var(--ink6);display:flex;gap:8px;justify-content:flex-end;background:var(--ink7);border-radius:0 0 var(--radius-xl) var(--radius-xl)}

/* ── MISC ── */
.pbar{height:5px;background:var(--ink6);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--or4);border-radius:3px;transition:width .4s}
.strow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ink6);font-size:13px}
.strow:last-child{border-bottom:none}
.strow .lbl{color:var(--ink3);font-size:12px}
.strow .val{font-weight:700;font-size:14px;letter-spacing:-.2px}
.al-list{display:flex;flex-direction:column;gap:6px}
.al-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--ink6);border-radius:10px;background:var(--w);transition:all .15s}
.al-item:hover{border-color:var(--ink5);background:var(--ink7)}
.al-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.al-info{flex:1;min-width:0}
.al-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-det{font-size:11px;color:var(--ink3);margin-top:1px}
.al-wa{font-size:11px;color:var(--b4);text-decoration:none;margin-left:auto;font-weight:500}
.tabrow{display:flex;border-bottom:1.5px solid var(--ink6);margin-bottom:18px}
.tabi{padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all .15s}
.tabi.on{color:var(--or4);border-bottom-color:var(--or4)}
.hist-it{border:1px solid var(--ink6);border-radius:11px;padding:14px 16px;margin-bottom:8px;background:var(--w)}
.hist-it:hover{border-color:var(--ink5)}
.hist-num{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:7px;background:var(--or4);color:#fff;font-size:10px;font-weight:700;margin-right:7px}
.hist-date{font-size:12px;color:var(--ink3);font-weight:600;display:flex;align-items:center;margin-bottom:8px}
.hist-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;background:var(--ink7);padding:10px 12px;border-radius:8px}
.hist-fl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink4);font-weight:700;margin-bottom:3px}
.hist-fv{color:var(--ink2);font-weight:500;line-height:1.4}
.prof-av{width:52px;height:52px;border-radius:14px;background:var(--or1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:var(--or4);flex-shrink:0}
.wt-row{display:flex;align-items:flex-end;gap:5px;height:72px;padding:8px 0;overflow-x:auto}
.wt-bw{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 calc(20% - 4px);min-width:50px}
.wt-b{width:100%;border-radius:4px 4px 0 0;background:var(--or2);border-top:2.5px solid var(--or4);min-height:4px}
.wt-v{font-size:10px;color:var(--or5);font-weight:700}
.wt-d{font-size:9px;color:var(--ink4);text-align:center;line-height:1.1}
.chip{display:inline-flex;align-items:center;background:var(--ink7);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--ink3);font-weight:500;border:1px solid var(--ink6)}
.apt-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px}
.apt-card:hover{border-color:var(--ink5)}
.apt-card-top{display:flex;align-items:center;gap:12px;padding:14px 18px}
.apt-card-body{padding:0 18px 14px}

/* ── DARK MODE ── */
[data-dark="1"]{
  --ink:#F0F0F0;--ink2:#D2D2D2;--ink3:#9A9A9A;--ink4:#666;--ink5:#3C3C3C;--ink6:#2A2A2A;--ink7:#1C1C1C;
  --w:#242424;
  --r1:#3D1212;--r6:#FCA5A5;
  --y1:#3D2800;--y6:#FCD34D;
  --g1:#0C2B15;--g6:#86EFAC;
  --b1:#0C1E3C;--b6:#93C5FD;
  --or1:#464646;--or2:#6B3000;--or6:#FDBA74;
}
[data-dark="1"] body{background:#141414}
[data-dark="1"] thead tr{background:#1e1e1e}
[data-dark="1"] tr:hover td{background:#2c2c2c}
[data-dark="1"] .topbar{background:#0A0A0A;border-bottom:1px solid #1f1f1f}
[data-dark="1"] .sidebar{background:#0F0F0F;border-right:1px solid #1c1c1c}
[data-dark="1"] .auth-shell{background:#141414}
[data-dark="1"] .tip-box{background:#E85D04;color:#fff}
[data-dark="1"] .tip-box::after{border-top-color:#E85D04}
[data-dark="1"] .hist-body{background:#1e1e1e}
[data-dark="1"] .toast{background:#E85D04;border-color:#C4470A}
[data-dark="1"] .fsel,[data-dark="1"] .srch input{color:var(--ink);background:var(--w)}
.kpi{overflow:visible}

/* ── DARK TOGGLE BTN ── */
.dark-toggle{background:rgba(255,255,255,0.08);border:1px solid #333;color:#aaa;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;flex-shrink:0}
.dark-toggle:hover{background:rgba(255,255,255,0.15);color:#fff}

/* ── MONTHLY HISTORY ── */
.hist-month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:4px}
.hist-month-card{background:var(--ink7);border:1px solid var(--ink6);border-radius:11px;padding:14px 16px;cursor:pointer;transition:all .15s}
.hist-month-card:hover{border-color:var(--or4);background:var(--w)}
.hist-month-card.active-month{border-color:var(--or4);background:var(--w)}
.hmc-name{font-size:13px;font-weight:700;letter-spacing:-.2px;margin-bottom:10px;color:var(--ink);text-transform:capitalize}
.hmc-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.hmc-lbl{color:var(--ink3)}
.hmc-val{font-weight:700}
.hmc-bar{height:4px;background:var(--ink6);border-radius:2px;overflow:hidden;margin-top:8px}
.hmc-fill{height:100%;border-radius:2px;background:var(--g4)}

/* ── GOAL CARD ── */
.goal-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px}
.goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.goal-title{font-size:13px;font-weight:700;color:var(--ink)}
.goal-numbers{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.goal-current{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--g4)}
.goal-sep{font-size:14px;color:var(--ink4)}
.goal-target{font-size:16px;font-weight:700;color:var(--ink3)}
.goal-pbar{height:8px;background:var(--ink6);border-radius:4px;overflow:hidden;margin-bottom:8px}
.goal-pfill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.goal-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.goal-pct{font-weight:800;font-size:13px}

/* ── SETTINGS ── */
.cfg-layout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.cfg-nav{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);padding:6px}
.cfg-nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.cfg-nav-item:hover{background:var(--ink7);color:var(--ink)}
.cfg-nav-item.on{background:var(--or1);color:var(--or5)}
.cfg-nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.cfg-panel{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);padding:24px}
.cfg-section-title{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.cfg-section-sub{font-size:12px;color:var(--ink3);margin-bottom:22px}
.cfg-divider{height:1px;background:var(--ink6);margin:20px 0}
.plan-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--ink6);border-radius:11px;margin-bottom:8px;background:var(--ink7);transition:all .15s}
.plan-card:hover{border-color:var(--ink5);background:var(--w)}
.plan-card-icon{width:38px;height:38px;background:var(--or1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--or5);font-weight:800;flex-shrink:0}
.plan-card-info{flex:1;min-width:0}
.plan-card-name{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:2px}
.plan-card-meta{font-size:11px;color:var(--ink3)}
.plan-card-price{font-size:14px;font-weight:800;color:var(--g4);margin-right:10px}
.plan-card-acts{display:flex;gap:5px}
.prof-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(255,255,255,0.06);border:1px solid #2a2a2a;border-radius:7px;cursor:pointer;transition:all .15s}
.prof-chip:hover{background:rgba(255,255,255,0.12)}
.prof-chip-av{width:22px;height:22px;border-radius:6px;background:var(--or4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.prof-chip-av img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.prof-chip-name{font-size:12px;font-weight:600;color:#ccc;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* avatar upload area */
.av-upload-wrap{display:flex;align-items:center;gap:20px;padding:16px;background:var(--ink7);border:1px solid var(--ink6);border-radius:12px;margin-bottom:20px}
.av-preview{width:72px;height:72px;border-radius:50%;background:var(--or1);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--or4);flex-shrink:0;overflow:hidden;border:3px solid var(--or2)}
.av-preview img{width:100%;height:100%;object-fit:cover}
.av-upload-btns{display:flex;flex-direction:column;gap:7px}
.av-upload-btns .hint{font-size:11px;color:var(--ink4);margin-top:2px}
/* photo editor */
.pe-wrap{position:relative;display:flex;align-items:center;justify-content:center;background:#111;border-radius:14px;overflow:hidden;margin-bottom:14px;cursor:grab;user-select:none;touch-action:none}
.pe-wrap:active{cursor:grabbing}
.pe-controls{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pe-hint{font-size:11px;color:var(--ink3);text-align:center;margin-bottom:4px}

/* ── PREVISTOS ── */
.prev-month-block{margin-bottom:12px;border:1px solid var(--ink6);border-radius:var(--radius-lg);overflow:hidden;background:var(--w)}
.prev-month-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s;gap:12px}
.prev-month-header:hover{background:var(--ink7)}
.prev-month-header.open{background:var(--or1);border-bottom:1px solid var(--or2)}
.prev-month-title{font-size:14px;font-weight:800;letter-spacing:-.2px;text-transform:capitalize;color:var(--ink)}
.prev-month-header.open .prev-month-title{color:var(--or5)}
.prev-month-meta{display:flex;align-items:center;gap:8px}
.prev-month-count{font-size:12px;font-weight:600;color:var(--ink3);background:var(--ink7);padding:2px 8px;border-radius:20px}
.prev-month-header.open .prev-month-count{background:var(--or2);color:var(--or6)}
.prev-month-arrow{font-size:12px;color:var(--ink4);transition:transform .2s;flex-shrink:0}
.prev-month-header.open .prev-month-arrow{transform:rotate(180deg);color:var(--or4)}
.prev-month-body{padding:0 0 6px}
.prev-pat-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--ink6);transition:background .15s}
.prev-pat-row:first-child{border-top:none}
.prev-pat-row:hover{background:var(--ink7)}
.prev-pat-av{width:34px;height:34px;border-radius:10px;background:var(--or1);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--or5);flex-shrink:0}
.prev-pat-info{flex:1;min-width:0}
.prev-pat-name{font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-pat-date{font-size:11px;color:var(--ink3);margin-top:1px}
.prev-pat-prog{display:flex;align-items:center;gap:5px;flex-shrink:0}
.prev-pat-prog-bar{width:48px;height:4px;background:var(--ink6);border-radius:2px;overflow:hidden}
.prev-pat-prog-fill{height:100%;background:var(--or4);border-radius:2px}
.prev-pat-prog-txt{font-size:10px;font-weight:700;color:var(--ink3);white-space:nowrap}
.prev-pat-wa{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;background:var(--g1);color:var(--g4);font-size:14px;text-decoration:none;flex-shrink:0;transition:background .15s}
.prev-pat-wa:hover{background:#dcfce7}
.prev-today-chip{display:inline-flex;align-items:center;padding:2px 7px;background:var(--or4);color:#fff;border-radius:20px;font-size:9px;font-weight:700;margin-left:5px;vertical-align:middle}
.prev-overdue-chip{display:inline-flex;align-items:center;padding:2px 7px;background:var(--r4);color:#fff;border-radius:20px;font-size:9px;font-weight:700;margin-left:5px;vertical-align:middle}

/* ── APT GROUP (Registros agrupado por paciente) ── */
.apt-group{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.apt-group:hover{box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.apt-group-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s}
.apt-group-header:hover{background:var(--ink7)}
.apt-group-header.open{background:var(--or1);border-bottom:1px solid var(--or2)}
.apt-group-av{width:38px;height:38px;border-radius:11px;background:var(--or1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--or5);flex-shrink:0;border:2px solid var(--or2)}
.apt-group-header.open .apt-group-av{background:var(--or4);color:#fff;border-color:var(--or5)}
.apt-group-info{flex:1;min-width:0}
.apt-group-name{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apt-group-header.open .apt-group-name{color:var(--or6)}
.apt-group-sub{font-size:11px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.apt-group-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.apt-group-count{font-size:11px;font-weight:700;color:var(--ink3);background:var(--ink7);padding:3px 9px;border-radius:20px;white-space:nowrap}
.apt-group-header.open .apt-group-count{background:var(--or2);color:var(--or6)}
.apt-group-arrow{font-size:11px;color:var(--ink4);transition:transform .2s;flex-shrink:0}
.apt-group-header.open .apt-group-arrow{transform:rotate(180deg);color:var(--or5)}
.apt-group-body{border-top:1px solid var(--ink6)}
.apt-group-body .apt-card{border-radius:0;border:none;border-bottom:1px solid var(--ink6);margin-bottom:0}
.apt-group-body .apt-card:last-child{border-bottom:none}
.cfg-schema{background:var(--ink7);border:1px solid var(--ink6);border-radius:10px;padding:14px 16px;font-size:12px;color:var(--ink3);font-family:monospace;line-height:1.8}
.cfg-schema strong{color:var(--or4);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px}
@media(max-width:760px){.cfg-layout{grid-template-columns:1fr}.cfg-nav{display:flex;flex-wrap:wrap;gap:3px;padding:4px}.cfg-nav-item{width:auto;padding:6px 9px;font-size:12px;border-radius:7px}.cfg-panel{padding:16px;border-radius:var(--mob-radius)}.cfg-section-title{font-size:14px;margin-bottom:3px}.cfg-section-sub{font-size:11px;margin-bottom:18px}.cfg-divider{margin:16px 0}.plan-card{padding:11px 13px;border-radius:10px;gap:10px;margin-bottom:6px}.plan-card-icon{width:34px;height:34px;font-size:13px}.plan-card-name{font-size:12px;margin-bottom:1px}.plan-card-meta{font-size:10px}.plan-card-price{font-size:13px}.av-upload-wrap{flex-direction:column;gap:14px;padding:12px}.av-preview{width:64px;height:64px;font-size:20px;border:2px solid var(--or2)}.av-upload-btns .hint{font-size:10px}.pe-controls{gap:4px}.cfg-schema{padding:10px 12px;font-size:11px}}

.mdl-sub{font-size:11px}

.mdl-bdy{padding:16px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mdl-ft{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,8px));border-radius:0;flex-shrink:0;position:relative;z-index:1}
.mdl-ft .btn-primary{flex:1;justify-content:center;min-height:44px;font-size:14px}
.mdl-ft .btn-ghost{min-height:44px;padding:0 16px}
.hist-it{padding:10px 12px;border-radius:9px;font-size:12px}
.hist-body{grid-template-columns:1fr;gap:5px;font-size:11px}
.hist-fl{font-size:9px}
.hist-fv{font-size:12px}
.hist-num{width:18px;height:18px;font-size:9px;margin-right:5px}
.hist-date{font-size:11px}
.wt-row{height:56px}
.hist-month-grid{grid-template-columns:1fr 1fr;gap:6px}
.hmc-name{font-size:12px}
.hmc-row{font-size:11px}
.goal-card{padding:14px var(--mob-pad);border-radius:var(--mob-radius)}
.goal-current{font-size:20px}
.goal-target{font-size:14px}
.goal-labels{font-size:10px}
.apt-card{border-radius:var(--mob-radius);font-size:11px}
.apt-card-top{padding:10px 12px;gap:8px}
.apt-card-body{padding:0 12px 10px}
.apt-card-fields{gap:6px;padding:10px 0}
.apt-fl{font-size:9px}
.apt-fv{font-size:12px}
.toast{bottom:74px;right:var(--mob-pad);left:var(--mob-pad);text-align:center;border-radius:10px;font-size:12px;padding:10px 14px}
.mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--w);border-top:1.5px solid var(--ink6);padding:8px 3px;padding-bottom:calc(15px + env(safe-area-inset-bottom,4px));z-index:200;align-items:stretch;gap:1px;height:auto;max-height:80px;}
.mob-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 0;border:none;background:none;color:var(--ink4);font-size:7px;font-weight:600;cursor:pointer;border-radius:8px;transition:var(--mob-trans);-webkit-tap-highlight-color:transparent;position:relative;min-height:48px;text-align:center}
.mob-nav-item:active{background:var(--ink7);transform:scale(.92)}
.mob-nav-item.on{color:var(--or4)}
.mob-nav-icon{font-size:16px;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:7px;transition:var(--mob-trans)}
.mob-nav-item.on .mob-nav-icon{background:var(--or1);font-size:15px;width:48px;height:28px;border-radius:20px}
.mob-nav-badge{position:absolute;top:0;right:50%;transform:translateX(12px);background:var(--r4);color:#fff;font-size:6px;font-weight:700;padding:0.25px 1.5px;border-radius:6px;min-width:10px;text-align:center;line-height:1;pointer-events:none}
.mob-nav-lbl{font-size:7px;font-weight:600;color:inherit;line-height:1;margin-top:0.5px}

/* ── PATIENT CARDS MOBILE ── */
.pat-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--mob-radius);padding:14px 16px;margin-bottom:8px;transition:all .15s}
.pat-card:active{background:var(--ink7)}
.pat-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pat-card-name{font-size:14px;font-weight:700;color:var(--or4);cursor:pointer;letter-spacing:-.2px}
.pat-card-id{font-family:monospace;font-size:10px;background:var(--ink7);color:var(--ink3);padding:2px 6px;border-radius:5px;margin-top:2px}
.pat-card-mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pat-card-bottom{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pat-card-stat{display:flex;flex-direction:column;gap:2px}
.pat-card-stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink4);font-weight:700}
.pat-card-stat-v{font-size:12px;font-weight:600;color:var(--ink2)}
.pat-card-acts{display:flex;gap:5px;margin-top:10px;border-top:1px solid var(--ink6);padding-top:10px}
.pat-card-acts .btn{flex:1;justify-content:center;min-height:36px;font-size:11px}
/* ── FIN CARDS MOBILE ── */
.fin-cards{display:none}
.fin-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--mob-radius);padding:14px 16px;margin-bottom:8px}
.fin-card.overdue{border-color:#fca5a5;background:#fff9f9}
.fin-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.fin-card-name{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.fin-card-id{font-family:monospace;font-size:9px;color:var(--ink4);margin-top:1px}
.fin-card-values{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.fin-card-val-box{background:var(--ink7);border-radius:8px;padding:8px 10px}
.fin-card-val-l{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink4);font-weight:700;margin-bottom:2px}
.fin-card-val-v{font-size:14px;font-weight:800;letter-spacing:-.3px}
.fin-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--ink3)}
.fin-card-acts{display:flex;gap:5px;border-top:1px solid var(--ink6);padding-top:10px}
.fin-card-acts .btn{flex:1;justify-content:center;min-height:36px;font-size:11px}
}
@media(max-width:768px){
.fin-cards{display:block}
.tw{display:none}
}
[data-dark="1"] .mob-nav{background:#0A0A0A;border-top-color:#1c1c1c}
[data-dark="1"] .mob-nav-item.on .mob-nav-icon{background:#3C1A00}

/* ── GAMIFICAÇÃO — RANKS & BADGES ── */
.rank-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:-.1px}
.rank-bruto{background:#2a2a2a;color:#aaa;border:1px solid #444}
.rank-destravado{background:#1e3a5f;color:#60a5fa;border:1px solid #3b82f6}
.rank-afiado{background:#1f2d3d;color:#a78bfa;border:1px solid #7c3aed}
.rank-imparavel{background:#3d1a00;color:#fb923c;border:1px solid #f97316}
.rank-lapidado{background:linear-gradient(135deg,#78350f,#92400e);color:#fcd34d;border:1px solid #d97706}
[data-dark="0"] .rank-bruto{background:#f3f4f6;color:#374151;border-color:#d1d5db}
[data-dark="0"] .rank-destravado{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd}
[data-dark="0"] .rank-afiado{background:#f5f3ff;color:#6d28d9;border-color:#c4b5fd}
[data-dark="0"] .rank-imparavel{background:#fff7ed;color:#c2410c;border-color:#fdba74}
[data-dark="0"] .rank-lapidado{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;border-color:#f59e0b}

.badge-svg{width:48px;height:48px;flex-shrink:0}
.badge-svg-lg{width:80px;height:80px}

.rankup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.rankup-card{background:var(--w);border-radius:20px;padding:32px 28px;max-width:380px;width:100%;text-align:center;animation:rankPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes rankPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.rankup-emoji{font-size:48px;margin-bottom:12px;display:block;animation:rankBounce 1s ease .3s both}
@keyframes rankBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.rankup-title{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.rankup-name{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:14px}
.rankup-msg{font-size:14px;color:var(--ink2);line-height:1.65;margin-bottom:22px}
.rankup-particles{font-size:24px;letter-spacing:4px;margin-bottom:16px}

.patient-rank-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink7);border-radius:9px;margin-bottom:8px}
.prb-pts{font-size:18px;font-weight:800;letter-spacing:-.4px;color:var(--or4);flex-shrink:0}
.prb-info{flex:1;min-width:0}
.prb-next{font-size:10px;color:var(--ink3);margin-top:2px}
.prb-bar{height:4px;background:var(--ink6);border-radius:2px;overflow:hidden;margin-top:4px}
.prb-fill{height:100%;border-radius:2px;background:var(--or4);transition:width .6s}

.ac-section{margin-bottom:20px}
.ac-section-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;cursor:pointer;user-select:none}
.ac-section-hd.red{background:#FFF1F0;border:1px solid #fca5a5}
.ac-section-hd.yellow{background:var(--y1);border:1px solid #fde68a}
.ac-section-hd.green{background:var(--g1);border:1px solid #86efac}
[data-dark="1"] .ac-section-hd.red{background:#3D1212;border-color:#7f1d1d}
[data-dark="1"] .ac-section-hd.yellow{background:#3D2800;border-color:#78350F}
[data-dark="1"] .ac-section-hd.green{background:#0C2B15;border-color:#14532D}
.ac-section-hd-left{display:flex;align-items:center;gap:10px}
.ac-section-hd-icon{font-size:18px;line-height:1}
.ac-section-hd-title{font-size:14px;font-weight:800;letter-spacing:-.2px}
.ac-section-hd.red .ac-section-hd-title{color:var(--r6)}
.ac-section-hd.yellow .ac-section-hd-title{color:var(--y6)}
.ac-section-hd.green .ac-section-hd-title{color:var(--g6)}
.ac-section-count{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,0.08)}
.ac-section-hd.red .ac-section-count{background:var(--r1);color:var(--r6)}
.ac-section-hd.yellow .ac-section-count{background:var(--y1);color:var(--y6)}
.ac-section-hd.green .ac-section-count{background:var(--g1);color:var(--g6)}
.ac-section-body{border:1px solid var(--ink6);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);overflow:hidden}
.ac-pat-card{background:var(--w);border-top:1px solid var(--ink6);padding:14px 16px;transition:background .15s}
.ac-pat-card:first-child{border-top:none}
.ac-pat-card:hover{background:var(--ink7)}
.ac-pat-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ac-pat-av{width:36px;height:36px;border-radius:10px;background:var(--or1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--or4);flex-shrink:0}
.ac-pat-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.ac-pat-meta{font-size:11px;color:var(--ink3);margin-top:2px}
.ac-pat-right{margin-left:auto;text-align:right}
.ac-days{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ac-days.hot{color:var(--r4)}
.ac-days.warm{color:var(--y4)}
.ac-days.cool{color:var(--g4)}
.ac-days-lbl{font-size:9px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
.ac-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.ac-actions.four{grid-template-columns:1fr 1fr 1fr 1fr}
.ac-btn{border:1.5px solid var(--ink6);background:var(--w);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink2);text-align:left;line-height:1.3;display:flex;flex-direction:column;gap:3px;min-height:52px}
.ac-btn:hover{border-color:var(--or4);color:var(--or4);background:var(--or1)}
.ac-btn:active{transform:scale(.97)}
.ac-btn-icon{font-size:14px;margin-bottom:1px}
.ac-btn-lbl{font-size:10px;font-weight:700;color:inherit}
.ac-btn-sub{font-size:9px;color:var(--ink3);font-weight:400}
.ac-hist-toggle{font-size:11px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 0;border:none;background:none;font-family:inherit;font-weight:500}
.ac-hist-toggle:hover{color:var(--or4)}
.ac-hist-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ac-hist-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ink7);border-radius:8px;font-size:11px}
.ac-hist-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ac-hist-info{flex:1;min-width:0}
.ac-hist-type{font-weight:600;color:var(--ink2)}
.ac-hist-date{color:var(--ink3);margin-top:1px;font-size:10px}
.ac-hist-resp{font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;flex-shrink:0}
.ac-hist-resp.yes{background:var(--g1);color:var(--g6)}
.ac-hist-resp.no{background:var(--r1);color:var(--r6)}
.ac-hist-resp.pend{background:var(--ink6);color:var(--ink3)}
.ac-empty{text-align:center;padding:32px 20px;background:var(--w);border:1px solid var(--ink6);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg);color:var(--ink3);font-size:13px}
.ac-dash-card{background:var(--w);border:1px solid var(--ink6);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px}
.ac-dash-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ac-dash-stats{display:flex;gap:0;margin-bottom:14px}
.ac-dash-stat{flex:1;text-align:center;padding:10px 8px;border-radius:8px}
.ac-dash-stat+.ac-dash-stat{margin-left:6px}
.ac-dash-stat.hot{background:#FFF1F0}
.ac-dash-stat.warm{background:var(--y1)}
.ac-dash-stat.cool{background:var(--g1)}
.ac-dash-num{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1;margin-bottom:3px}
.ac-dash-stat.hot .ac-dash-num{color:var(--r4)}
.ac-dash-stat.warm .ac-dash-num{color:var(--y4)}
.ac-dash-stat.cool .ac-dash-num{color:var(--g4)}
.ac-dash-lbl{font-size:10px;font-weight:600;color:var(--ink3)}
[data-dark="1"] .ac-dash-stat.hot{background:#3D1212}
[data-dark="1"] .ac-dash-stat.warm{background:#3D2800}
[data-dark="1"] .ac-dash-stat.cool{background:#0C2B15}
[data-dark="1"] .ac-pat-card{background:var(--w)}
[data-dark="1"] .ac-pat-card:hover{background:#2a2a2a}
[data-dark="1"] .ac-btn{background:var(--w);border-color:var(--ink5)}
@media(max-width:768px){
  .ac-actions{grid-template-columns:1fr 1fr}
  .ac-actions.four{grid-template-columns:1fr 1fr}
  .ac-btn{font-size:10px;padding:7px 8px;min-height:48px}
  .ac-days{font-size:18px}
}</style>

// ─── CONFIG ───
const CFG_KEY='nutri_sb_cfg';
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))}catch{return null}}
function saveCfg(url,key){localStorage.setItem(CFG_KEY,JSON.stringify({url,key}))}
function clearCfg(){localStorage.removeItem(CFG_KEY)}

// ─── SUPABASE CLIENT ───
let SB=null;
function initSB(url,key){
  SB=window.supabase.createClient(url,key);
  return SB;
}

// ─── DATA ADAPTERS ───
// Default built-in plans (used as fallback before DB loads)
const DEFAULT_PLANS={Avulsa:{days:30,sessions:1,price:null},['3M']:{days:90,sessions:3,price:null},['6M']:{days:180,sessions:6,price:null},['12M']:{days:365,sessions:12,price:null}};
let PLANS=DEFAULT_PLANS; // will be overridden by DB plans

const toPlan=r=>r?({id:r.id,name:r.name,days:r.duration_days,sessions:r.sessions,price:r.price||null}):null;
const fromPlan=(p,uid)=>({id:p.id||undefined,user_id:uid,name:p.name,duration_days:parseInt(p.days)||30,sessions:parseInt(p.sessions)||1,price:p.price?parseFloat(p.price):null});
const toProfile=r=>r?({userId:r.user_id,fullName:r.full_name||'',instagram:r.instagram||'',whatsapp:r.whatsapp||'',avatarData:r.avatar_data||null}):null;
const fromProfile=(p,uid)=>({user_id:uid,full_name:p.fullName||'',instagram:p.instagram||'',whatsapp:p.whatsapp||'',avatar_data:p.avatarData||null});
const fmt=d=>{if(!d)return'—';const dt=d instanceof Date?d:new Date(d+'T00:00:00');return isNaN(dt)?'—':dt.toLocaleDateString('pt-BR')};
const fmtM=v=>v!=null&&v!==''?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(parseFloat(v)||0):'—';
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const diff=(a,b)=>Math.floor((new Date(a)-new Date(b))/86400000);
const ini=n=>n?n.trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''):'?';

const toPat=r=>r?({id:r.id,name:r.name,phone:r.phone||'',plan:r.plan,startDate:r.start_date,notes:r.notes||''}):null;
const fromPat=(p,uid)=>({id:p.id,user_id:uid,name:p.name,phone:p.phone||'',plan:p.plan,start_date:p.startDate,notes:p.notes||''});
const toApt=r=>r?({id:r.id,patientId:r.patient_id,date:r.date,weight:r.weight,evaluation:r.evaluation||'',conduct:r.conduct||'',nextDate:r.next_date,notes:r.notes||''}):null;
const fromApt=(a,uid)=>({id:a.id,user_id:uid,patient_id:a.patientId,date:a.date,weight:a.weight?parseFloat(a.weight):null,evaluation:a.evaluation||'',conduct:a.conduct||'',next_date:a.nextDate||null,notes:a.notes||''});
const toFin=r=>r?({id:r.id,patientId:r.patient_id,date:r.date,totalValue:r.total_value,paidValue:r.paid_value,payMethod:r.pay_method||'PIX',dueDate:r.due_date,status:r.status,notes:r.notes||''}):null;

// Helper: build PLANS lookup from array
function buildPlansMap(arr){
  if(!arr||!arr.length)return DEFAULT_PLANS;
  const m={};arr.forEach(p=>m[p.name]={days:p.days,sessions:p.sessions,price:p.price});return m;
}

// ─── BUSINESS LOGIC ───
function endDate(start,plan){if(!start||!plan||!PLANS[plan])return null;const d=new Date(start+'T00:00:00');d.setDate(d.getDate()+PLANS[plan].days);return d}
function lastC(pid,apts){const pts=apts.filter(a=>a.patientId===pid&&a.date);if(!pts.length)return null;return new Date(Math.max(...pts.map(a=>new Date(a.date+'T00:00:00'))))}
function nextC(pid,apts){const l=lastC(pid,apts);if(!l)return null;const n=new Date(l);n.setDate(n.getDate()+30);return n}
function cntC(pid,apts){return apts.filter(a=>a.patientId===pid).length}
function calcStatus(p,apts){
  const now=today();const end=endDate(p.startDate,p.plan);
  if(end&&now>end)return'PLANO ENCERRADO';
  const last=lastC(p.id,apts);if(!last)return'SEM CONSULTA';
  const d=diff(now,last);
  if(d>30)return'ATRASADO';
  const nx=new Date(last);nx.setDate(nx.getDate()+30);const win=new Date(nx);win.setDate(win.getDate()-5);
  if(now>=win)return'CONTATAR HOJE';return'EM DIA';
}
function calcRen(p){const now=today();const end=endDate(p.startDate,p.plan);if(!end)return'—';if(now>end)return'VENCIDO';if(diff(end,now)<=7)return'RENOVAR';return'OK'}

const SBCLS={'EM DIA':'b-ok','CONTATAR HOJE':'b-warn','ATRASADO':'b-danger','SEM CONSULTA':'b-muted','PLANO ENCERRADO':'b-muted'};
const RNCLS={'OK':'b-ok','RENOVAR':'b-warn','VENCIDO':'b-crit','—':''};
const PYCLS={'PAGO':'b-paid','PENDENTE':'b-pending','PARCIAL':'b-partial'};
const ADOT={'ATRASADO':'#E84040','CONTATAR HOJE':'#D97706'};

function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
function Bdg({c,l}){return h('span',{className:'badge '+c},l)}
function Tip({text,children}){return h('span',{className:'tip-wrap'},children,h('span',{className:'tip-box'},text))}
function InfoDot({text}){return h(Tip,{text},h('span',{className:'info-dot'},'?'))}
function Modal({title,sub,onClose,wide,children}){
  return h('div',{className:'ov',onClick:e=>e.target===e.currentTarget&&onClose()},
    h('div',{className:'mdl'+(wide?' mdl-lg':'')},
      h('div',{className:'mdl-top'},
        h('div',null,h('div',{className:'mdl-ttl'},title),sub&&h('div',{className:'mdl-sub'},sub)),
        h('button',{className:'mdl-x',onClick:onClose},'×')
      ),
      h('div',{className:'mdl-bdy'},children)
    )
  )
}

// ─── SETUP SCREEN ───
function SetupScreen({onDone}){
  const[url,su]=useState('');const[key,sk]=useState('');const[err,se]=useState('');const[loading,sl]=useState(false);
  const go=async()=>{
    const u=url.trim(),k=key.trim();
    if(!u||!k){se('Preencha os dois campos.');return}
    if(!u.includes('supabase.co')){se('URL inválida. Deve conter supabase.co');return}
    sl(true);se('');
    try{
      const client=window.supabase.createClient(u,k);
      const{error}=await client.from('patients').select('id').limit(1);
      if(error&&error.code!=='PGRST116'&&!error.message.includes('does not exist')){se('Credenciais inválidas: '+error.message);sl(false);return}
      saveCfg(u,k);initSB(u,k);onDone();
    }catch(e){se('Erro: '+e.message);sl(false)}
  };
  return h('div',{className:'auth-shell'},
    h('div',{className:'auth-card'},
      h('div',{className:'auth-logo'},h('div',{className:'auth-mark'},h('img',{src:'assets/logo_lapidados_control.svg',alt:'Lapidados Control',style:{width:'100%',height:'100%',objectFit:'contain'}})),h('div',null,h('div',{className:'auth-brand'},'Lapidados',h('span',null,'Control')),h('div',{style:{fontSize:12,color:'var(--ink3)',marginTop:2}},'Configuração inicial'))),
      h('div',{className:'auth-title'},'Conectar ao Supabase'),
      h('div',{className:'auth-sub'},'Para usar, você precisa colar as credenciais do seu projeto Supabase. São encontradas em: Project Settings → API.'),
      [['1','Acesse app.supabase.com e abra seu projeto'],['2','Vá em Settings → API'],['3','Copie a Project URL e a anon public key abaixo']].map(([n,t])=>
        h('div',{key:n,className:'auth-step'},h('div',{className:'auth-step-n'},n),h('span',null,t))
      ),
      h('div',{style:{height:20}}),
      err&&h('div',{className:'auth-err'},err),
      h('div',{className:'fl',style:{marginBottom:14}},
        h('label',{className:'flb'},'Project URL'),
        h('input',{className:'fi',value:url,onChange:e=>su(e.target.value),placeholder:'https://xxxxxxxxxxx.supabase.co'})
      ),
      h('div',{className:'fl',style:{marginBottom:20}},
        h('label',{className:'flb'},'Anon Public Key'),
        h('input',{className:'fi',value:key,onChange:e=>sk(e.target.value),placeholder:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...',type:'password'})
      ),
      h('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center'},onClick:go,disabled:loading},loading?'Verificando...':'Conectar e continuar')
    )
  )
}

// ─── AUTH SCREEN ───
function AuthScreen({onLogin}){
  const[tab,st]=useState('login');const[email,se]=useState('');const[pass,sp]=useState('');const[err,serr]=useState('');const[ok,sok]=useState('');const[loading,sl]=useState(false);
  const go=async()=>{
    if(!email||!pass){serr('Preencha email e senha.');return}
    sl(true);serr('');sok('');
    try{
      if(tab==='login'){
        const{data,error}=await SB.auth.signInWithPassword({email,password:pass});
        if(error){serr(error.message);sl(false);return}
        onLogin(data.session);
      }else{
        const{error}=await SB.auth.signUp({email,password:pass});
        if(error){serr(error.message);sl(false);return}
        sok('Conta criada! Verifique seu email para confirmar, depois faça login.');st('login');
      }
    }catch(e){serr(e.message);}
    sl(false);
  };
  return h('div',{className:'auth-shell'},
    h('div',{className:'auth-card'},
      h('div',{className:'auth-logo'},h('div',{className:'auth-mark'},h('img',{src:'assets/logo_lapidados_control.svg',alt:'Lapidados Control',style:{width:'100%',height:'100%',objectFit:'contain'}})),h('div',null,h('div',{className:'auth-brand'},'Lapidados',h('span',null,'Control')))),
      h('div',{className:'auth-tabs'},
        ['login','signup'].map(t=>h('button',{key:t,className:'auth-tab'+(tab===t?' on':''),onClick:()=>{st(t);serr('');sok('')}},{login:'Entrar',signup:'Criar conta'}[t]))
      ),

// ─── SAFE ID GENERATOR (queries DB, never reuses deleted IDs) ───
async function getNextPatId(userId){
  const{data}=await SB.from('patients').select('id').eq('user_id',userId);
  const nums=(data||[]).map(p=>{const m=p.id&&p.id.match(/PAC-(\d+)/);return m?parseInt(m[1]):0});
  return'PAC-'+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
}

// ─── DATA HOOK — partial re-fetch per table ───
function useData(userId){
  const[pats,sp]=useState([]);
  const[apts,sa]=useState([]);
  const[fin,sf]=useState([]);
  const[plans,spl]=useState([]);
  const[profile,spr]=useState(null);
  const[loading,sl]=useState(true);

  const loadPats=useCallback(async()=>{
    if(!SB||!userId)return;
    const{data}=await SB.from('patients').select('*').eq('user_id',userId).order('created_at');
    sp((data||[]).map(toPat));
  },[userId]);

  const loadApts=useCallback(async()=>{
    if(!SB||!userId)return;
    const{data}=await SB.from('appointments').select('*').eq('user_id',userId).order('date',{ascending:false});
    sa((data||[]).map(toApt));
  },[userId]);

  const loadFin=useCallback(async()=>{
    if(!SB||!userId)return;
    const{data}=await SB.from('financial').select('*').eq('user_id',userId).order('date',{ascending:false});
    sf((data||[]).map(toFin));
  },[userId]);

  const loadPlans=useCallback(async()=>{
    if(!SB||!userId)return;
    const{data}=await SB.from('plans').select('*').eq('user_id',userId).order('duration_days');
    let arr=(data||[]).map(toPlan);
    if(arr.length===0){
      // Auto-seed default plans on first use
      const defaults=Object.entries(DEFAULT_PLANS).map(([name,p])=>({name,duration_days:p.days,sessions:p.sessions,price:null,user_id:userId}));
      const{data:ins}=await SB.from('plans').insert(defaults).select();
      arr=(ins||[]).map(toPlan);
    }
    spl(arr);
    PLANS=buildPlansMap(arr);
  },[userId]);

  const loadProfile=useCallback(async()=>{
    if(!SB||!userId)return;
    const{data}=await SB.from('profile').select('*').eq('user_id',userId).maybeSingle();
    spr(data?toProfile(data):null);
  },[userId]);

  const loadAll=useCallback(async()=>{
    if(!SB||!userId)return;
    sl(true);
    await Promise.all([loadPats(),loadApts(),loadFin(),loadPlans(),loadProfile()]);
    sl(false);
  },[userId,loadPats,loadApts,loadFin,loadPlans,loadProfile]);

  useEffect(()=>{loadAll()},[loadAll]);

  return{pats,apts,fin,plans,profile,loading,reload:loadAll,_userId:userId,
    async addPat(p){
      const id=await getNextPatId(userId);
      const{error}=await SB.from('patients').insert(fromPat({...p,id},userId));
      if(error)throw error;
      await loadPats();
    },
    async updPat(p){
      const{error}=await SB.from('patients').update(fromPat(p,userId)).eq('id',p.id);
      if(error)throw error;
      await loadPats();
    },
    async delPat(id){
      const{error}=await SB.from('patients').delete().eq('id',id);
      if(error)throw error;
      await Promise.all([loadPats(),loadApts()]);
    },
    async addApt(a){
      const{error}=await SB.from('appointments').insert(fromApt(a,userId));
      if(error)throw error;
      await loadApts();
    },
    async updApt(a){
      const{error}=await SB.from('appointments').update(fromApt(a,userId)).eq('id',a.id);
      if(error)throw error;
      await loadApts();
    },
    async delApt(id){
      const{error}=await SB.from('appointments').delete().eq('id',id);
      if(error)throw error;
      await loadApts();
    },
    async addFin(f){
      const{error}=await SB.from('financial').insert(fromFin(f,userId));
      if(error)throw error;
      await loadFin();
    },
    async updFin(f){
      const{error}=await SB.from('financial').update(fromFin(f,userId)).eq('id',f.id);
      if(error)throw error;
      await loadFin();
    },
    async delFin(id){
      const{error}=await SB.from('financial').delete().eq('id',id);
      if(error)throw error;
      await loadFin();
    },
    // Plans CRUD
    async addPlan(p){
      const{error}=await SB.from('plans').insert(fromPlan(p,userId));
      if(error)throw error;
      await loadPlans();
    },
    async updPlan(p){
      const{error}=await SB.from('plans').update(fromPlan(p,userId)).eq('id',p.id);
      if(error)throw error;
      await loadPlans();
    },
    async delPlan(id){
      const{error}=await SB.from('plans').delete().eq('id',id);
      if(error)throw error;
      await loadPlans();
    },
    // Profile upsert
    async saveProfile(p){
      const{error}=await SB.from('profile').upsert(fromProfile(p,userId),{onConflict:'user_id'});
      if(error)throw error;
      await loadProfile();
    }
  };
}

function exportCSV(data,name){
  if(!data.length)return alert('Nada para exportar.');
  const ks=Object.keys(data[0]);
  const rows=[ks,...data.map(r=>ks.map(k=>JSON.stringify(r[k]??'')))];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download=name;a.click();
}

// ─── PREVISTOS ───
function Previstos({pats,apts}){
  const now=today();
  const[openMonths,sop]=useState(()=>{
    // open current + next month by default
    const keys=new Set();
    const d1=new Date(now);const d2=new Date(now);d2.setMonth(d2.getMonth()+1);
    [d1,d2].forEach(d=>keys.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')));
    return keys;
  });

  const toggleMonth=key=>sop(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n});

  // Build predictions: each active patient → next predicted date
  const predictions=useMemo(()=>{
    const rows=[];
    pats.forEach(p=>{
      const end=endDate(p.startDate,p.plan);
      // skip plans already ended
      if(end&&now>end)return;
      const last=lastC(p.id,apts);
      let predDate;
      if(last){predDate=new Date(last);predDate.setDate(predDate.getDate()+30);}
      else if(p.startDate){predDate=new Date(p.startDate+'T00:00:00');predDate.setDate(predDate.getDate()+30);}
      else return;
      const cnt=cntC(p.id,apts);
      const total=PLANS[p.plan]?PLANS[p.plan].sessions:0;
      // skip if already used all sessions
      if(total>0&&cnt>=total)return;
      rows.push({pat:p,predDate,cnt,total});
    });
    // sort by date ascending (priority = closest first)
    return rows.sort((a,b)=>a.predDate-b.predDate);
  },[pats,apts]);

  // Group by month key YYYY-MM
  const byMonth=useMemo(()=>{
    const map={};
    predictions.forEach(r=>{
      const key=r.predDate.getFullYear()+'-'+String(r.predDate.getMonth()+1).padStart(2,'0');
      if(!map[key])map[key]={key,label:r.predDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),rows:[]};
      map[key].rows.push(r);
    });
    return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
  },[predictions]);

  if(byMonth.length===0)return h('div',{className:'empty',style:{padding:'60px 24px'}},
    h('div',{className:'empty-icon'},'📅'),
    h('div',{className:'empty-tt'},'Nenhum atendimento previsto'),
    h('p',null,'Pacientes sem consultas registradas ou com planos encerrados não aparecem aqui.')
  );

  return h('div',null,
    h('div',{style:{fontSize:12,color:'var(--ink3)',marginBottom:16,padding:'10px 14px',background:'var(--ink7)',borderRadius:10,border:'1px solid var(--ink6)'}},
      '📌 Previsão baseada na última consulta + 30 dias. Clique num mês para ver os pacientes.'
    ),
    byMonth.map(({key,label,rows})=>{
      const isOpen=openMonths.has(key);
      const isCurrent=key===(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
      return h('div',{key,className:'prev-month-block'},
        h('div',{className:'prev-month-header'+(isOpen?' open':''),onClick:()=>toggleMonth(key)},
          h('div',{style:{display:'flex',alignItems:'center',gap:8}},
            h('div',{className:'prev-month-title'},label),
            isCurrent&&h('span',{className:'prev-today-chip'},'este mês')
          ),
          h('div',{className:'prev-month-meta'},
            h('span',{className:'prev-month-count'},rows.length+' paciente'+(rows.length!==1?'s':'')),
            h('span',{className:'prev-month-arrow'},'▾')
          )
        ),
        isOpen&&h('div',{className:'prev-month-body'},
          rows.map(({pat,predDate,cnt,total})=>{
            const pct=total>0?Math.min(100,Math.round(cnt/total*100)):0;
            const isPast=predDate<now;
            const isThisWeek=!isPast&&diff(predDate,now)<=7;
            return h('div',{key:pat.id,className:'prev-pat-row'},
              h('div',{className:'prev-pat-av'},ini(pat.name)),
              h('div',{className:'prev-pat-info'},
                h('div',{className:'prev-pat-name'},pat.name,
                  isPast&&h('span',{className:'prev-overdue-chip'},'atrasado'),
                  isThisWeek&&!isPast&&h('span',{className:'prev-today-chip'},'esta semana')
                ),
                h('div',{className:'prev-pat-date'},
                  isPast?'Prevista: '+fmt(predDate)+' ('+Math.abs(diff(predDate,now))+'d atrás)':
                  'Prevista: '+fmt(predDate)+(diff(predDate,now)===0?' · hoje':' · em '+diff(predDate,now)+'d')
                )
              ),
              total>0&&h('div',{className:'prev-pat-prog'},
                h('div',{className:'prev-pat-prog-bar'},h('div',{className:'prev-pat-prog-fill',style:{width:pct+'%'}})),

  const monthOpts=useMemo(()=>{
    const seen=new Set();
    return [...apts].sort((a,b)=>b.date.localeCompare(a.date)).reduce((acc,a)=>{
      if(!a.date)return acc;
      const d=new Date(a.date+'T00:00:00');
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!seen.has(key)){seen.add(key);acc.push({key,label:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})});}
      return acc;
    },[]);
  },[apts]);

  // filtered flat list (used for CSV export + grouping)
  const filt=[...apts].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(a=>{
    const s=q.toLowerCase();const p=pm[a.patientId];
    if(s&&!(p&&p.name.toLowerCase().includes(s))&&!a.patientId.toLowerCase().includes(s))return false;
    if(pf&&a.patientId!==pf)return false;
    if(mf&&a.date){const d=new Date(a.date+'T00:00:00');const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(k!==mf)return false;}
    return true;
  });

  // group by patient — ordered by most recent appointment first
  const groups=useMemo(()=>{
    const map={};
    filt.forEach(a=>{
      if(!map[a.patientId])map[a.patientId]={patientId:a.patientId,apts:[]};
      map[a.patientId].apts.push(a);

    return Object.values(map).sort((a,b)=>new Date(b.apts[0].date)-new Date(a.apts[0].date));
  },[filt]);

  const togglePat=id=>sop(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n});

  const save=async d=>{ss(true);try{if(modal==='new')await db.addApt({...d,id:'AT-'+Date.now()});else await db.updApt({...d,id:modal.id});sm(null);toast('Atendimento salvo.');}catch(e){alert('Erro: '+e.message);}ss(false)};
  const del=async id=>{if(!confirm('Excluir atendimento?'))return;try{await db.delApt(id);toast('Removido.');}catch(e){alert(e.message)}};

        subtab==='registros'&&h('button',{className:'btn btn-ghost',onClick:()=>exportCSV(filt.map(a=>{const p=pm[a.patientId];return{Data:fmt(a.date),Paciente:p?p.name:a.patientId,'Nº':cm[a.id]||'',Peso:a.weight,Avaliação:a.evaluation,Conduta:a.conduct,Próxima:fmt(a.nextDate)}}),'atendimentos.csv')},'Exportar CSV'),
        h('button',{className:'btn btn-primary',onClick:()=>sm('new')},'+ Novo atendimento')
      )
    ),
    h('div',{className:'tabrow'},
      [['registros','📋 Registros'],['previstos','📅 Previstos']].map(([id,lbl])=>
        h('button',{key:id,className:'tabi'+(subtab===id?' on':''),onClick:()=>sst(id)},lbl)

    subtab==='previstos'?h(Previstos,{pats,apts}):
    apts.length===0?h('div',{style:{textAlign:'center',padding:'60px',background:'var(--w)',border:'1px solid var(--ink6)',borderRadius:'var(--radius-lg)'}},
      h('div',{style:{fontSize:28,marginBottom:12,opacity:.35}},'📋'),
      h('div',{style:{fontSize:15,fontWeight:700,marginBottom:6,color:'var(--ink2)'}},'Nenhum atendimento registrado'),
      h('p',{style:{fontSize:13,color:'var(--ink3)',maxWidth:340,margin:'0 auto 20px',lineHeight:1.6}},'Registre consultas para acompanhar peso, avaliações e condutas de cada paciente.'),
      h('button',{className:'btn btn-primary',style:{display:'inline-flex'},onClick:()=>sm('new')},'+ Registrar primeiro atendimento')
    ):h('div',null,
      h('div',{className:'tbar'},
        h('div',{className:'tbar-l'},
          h('div',{className:'srch'},h('span',{className:'srch-ic'},'⌕'),h('input',{placeholder:'Buscar por paciente...',value:q,onChange:e=>sq(e.target.value)})),
          patOpts.length>0&&h('select',{className:'fsel',value:pf,onChange:e=>spf(e.target.value)},h('option',{value:''},'Todos os pacientes'),...patOpts.map(p=>h('option',{key:p.id,value:p.id},p.name))),

        ),

        )

      groups.map(({patientId,apts:gApts})=>{
        const p=pm[patientId];
        const isOpen=openPats.has(patientId);
        const last=gApts[0]; // already sorted newest first
        const plan=p&&PLANS[p.plan];
        const sessTotal=plan?plan.sessions:0;
        const sessDone=gApts.length;

            h('div',{className:'apt-group-info'},

              h('div',{className:'apt-group-sub'},
                h('span',null,'Último: '+fmt(last.date)+(last.weight?' · '+last.weight+' kg':'')),
                p&&h('span',{className:'badge b-brand',style:{fontSize:10}},p.plan),
                sessTotal>0&&h('span',null,sessDone+'/'+sessTotal+' consultas ('+pct+'%)')

                h('div',{style:{flex:1,minWidth:0}},
                  h('div',{style:{fontWeight:600,fontSize:13,letterSpacing:'-.1px'}},fmt(a.date)+(a.weight?' · '+a.weight+' kg':'')),

                ),
                h('div',{style:{display:'flex',gap:5,marginLeft:8}},
                  h('button',{className:'btn btn-ghost btn-xs',onClick:e=>{e.stopPropagation();sm(a)}},'Editar'),

const GOAL_KEY='lapidados_goal';
function Financial({fin,pats,db}){

  const[goal,setGoal]=useState(()=>parseFloat(localStorage.getItem(GOAL_KEY)||'0'));
  const[editGoal,sEG]=useState(false);const[goalInput,sGI]=useState('');
  const[histOpen,sHO]=useState(false);
  const now=today();const pm=Object.fromEntries(pats.map(p=>[p.id,p]));

  // ── build month summaries from ALL records ──
  const monthSummaries=useMemo(()=>{
    const map={};
    fin.forEach(f=>{
      if(!f.date)return;
      const d=new Date(f.date+'T00:00:00');
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!map[key])map[key]={key,label:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),fat:0,pend:0,total:0,count:0};
      map[key].count++;
      map[key].total+=(parseFloat(f.totalValue)||0);
      if(f.status==='PAGO')map[key].fat+=(parseFloat(f.paidValue)||0);
      if(f.status==='PENDENTE')map[key].pend+=(parseFloat(f.totalValue)||0);
      if(f.status==='PARCIAL')map[key].pend+=(parseFloat(f.totalValue)||0)-(parseFloat(f.paidValue)||0);
    });
    return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));
  },[fin]);

  const maxFat=monthSummaries.length?Math.max(...monthSummaries.map(m=>m.fat),1):1;

  const months=[...new Set(fin.map(f=>f.date?new Date(f.date+'T00:00:00').toLocaleDateString('pt-BR',{month:'short',year:'numeric'}):'').filter(Boolean))];

  const fat=filt.filter(f=>f.status==='PAGO').reduce((s,f)=>s+(parseFloat(f.paidValue)||0),0);
  const pend=filt.reduce((s,f)=>{if(f.status==='PENDENTE')return s+(parseFloat(f.totalValue)||0);if(f.status==='PARCIAL')return s+(parseFloat(f.totalValue)||0)-(parseFloat(f.paidValue)||0);return s;},0);
  const m=now.getMonth(),y=now.getFullYear();
  const monthFat=fin.filter(f=>f.status==='PAGO'&&f.date&&new Date(f.date+'T00:00:00').getMonth()===m&&new Date(f.date+'T00:00:00').getFullYear()===y).reduce((s,f)=>s+(parseFloat(f.paidValue)||0),0);

  const del=async id=>{if(!confirm('Excluir lançamento?'))return;try{await db.delFin(id);toast('Removido.');}catch(e){alert(e.message)}};

      h('div',{style:{display:'flex',gap:8}},
        h('button',{className:'btn btn-ghost',onClick:()=>exportCSV(filt.map(f=>{const p=pm[f.patientId];return{Data:fmt(f.date),Paciente:p?p.name:f.patientId,Plano:p?p.plan:'',Total:f.totalValue,Pago:f.paidValue,Forma:f.payMethod,Status:f.status,Vencimento:fmt(f.dueDate)}}),'financeiro.csv')},'Exportar CSV'),
        h('button',{className:'btn btn-primary',onClick:()=>sm('new')},'+ Novo lançamento')

          h('div',{className:'goal-title'},'Meta de faturamento — '+now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})),

// ─── PHOTO EDITOR ───
function PhotoEditor({src,onConfirm,onCancel}){
  const SIZE=300;
  const canvasRef=useRef(null);
  const imgRef=useRef(null);
  const st=useRef({scale:1,ox:0,oy:0,rot:0,drag:false,lx:0,ly:0});

  function draw(){
    const cv=canvasRef.current,img=imgRef.current;
    if(!cv||!img)return;
    const ctx=cv.getContext('2d');
    const{scale,ox,oy,rot}=st.current;
    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,SIZE,SIZE);
    const fit=Math.max(SIZE/img.width,SIZE/img.height);
    const iw=img.width*fit,ih=img.height*fit;
    ctx.save();
    ctx.translate(SIZE/2+ox,SIZE/2+oy);
    ctx.rotate(rot*Math.PI/180);
    ctx.scale(scale,scale);
    ctx.drawImage(img,-iw/2,-ih/2,iw,ih);
    ctx.restore();
    // overlay + circle
    ctx.fillStyle='rgba(0,0,0,0.48)';
    ctx.beginPath();
    ctx.rect(0,0,SIZE,SIZE);
    ctx.arc(SIZE/2,SIZE/2,SIZE/2-8,0,Math.PI*2,true);
    ctx.fill('evenodd');
    ctx.strokeStyle='#E85D04';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(SIZE/2,SIZE/2,SIZE/2-8,0,Math.PI*2);ctx.stroke();
  }

  useEffect(()=>{
    const img=new Image();
    img.onload=()=>{imgRef.current=img;draw();};
    img.src=src;
  },[src]);

  function pos(e){
    const r=canvasRef.current.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return{x:t.clientX-r.left,y:t.clientY-r.top};
  }
  function onDown(e){const p=pos(e);st.current.drag=true;st.current.lx=p.x;st.current.ly=p.y;e.preventDefault()}
  function onMove(e){
    if(!st.current.drag)return;
    const p=pos(e);
    st.current.ox+=p.x-st.current.lx;st.current.oy+=p.y-st.current.ly;
    st.current.lx=p.x;st.current.ly=p.y;
    draw();e.preventDefault();
  }
  function onUp(){st.current.drag=false}
  function onWheel(e){
    e.preventDefault();
    st.current.scale=Math.max(0.15,Math.min(9,st.current.scale+(e.deltaY>0?-0.09:0.09)));
    draw();
  }
  function rotate(d){st.current.rot=(st.current.rot+d+360)%360;draw()}
  function zoom(d){st.current.scale=Math.max(0.15,Math.min(9,st.current.scale+d));draw()}
  function reset(){st.current.scale=1;st.current.ox=0;st.current.oy=0;st.current.rot=0;draw()}

  function confirm(){
    const out=document.createElement('canvas');
    out.width=220;out.height=220;
    const ctx=out.getContext('2d');
    const img=imgRef.current;if(!img)return;
    const{scale,ox,oy,rot}=st.current;
    const ratio=220/SIZE;
    ctx.beginPath();ctx.arc(110,110,110,0,Math.PI*2);ctx.clip();
    ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,220,220);
    const fit=Math.max(SIZE/img.width,SIZE/img.height);
    const iw=img.width*fit,ih=img.height*fit;
    ctx.save();
    ctx.translate(110+ox*ratio,110+oy*ratio);
    ctx.rotate(rot*Math.PI/180);
    ctx.scale(scale*ratio,scale*ratio);
    ctx.drawImage(img,-iw/2,-ih/2,iw,ih);
    ctx.restore();
    onConfirm(out.toDataURL('image/jpeg',0.88));
  }

  return h(Modal,{title:'Ajustar foto',sub:'Arraste para reposicionar · scroll para zoom',onClose:onCancel,wide:true},
    h('div',{style:{textAlign:'center'}},
      h('div',{
        className:'pe-wrap',style:{width:SIZE+'px',height:SIZE+'px',display:'inline-block'},
        onMouseDown:onDown,onMouseMove:onMove,onMouseUp:onUp,onMouseLeave:onUp,
        onTouchStart:onDown,onTouchMove:onMove,onTouchEnd:onUp,onWheel:onWheel
      },
        h('canvas',{ref:canvasRef,width:SIZE,height:SIZE,style:{display:'block'}})
      )
    ),
    h('div',{className:'pe-controls'},
      h('button',{className:'btn btn-ghost btn-sm',onClick:()=>rotate(-90)},'↺ Girar esq.'),
      h('button',{className:'btn btn-ghost btn-sm',onClick:()=>rotate(90)},'↻ Girar dir.'),
      h('button',{className:'btn btn-ghost btn-sm',onClick:()=>zoom(0.25)},'+  Zoom'),
      h('button',{className:'btn btn-ghost btn-sm',onClick:()=>zoom(-0.25)},'−  Zoom'),
      h('button',{className:'btn btn-ghost btn-sm',onClick:reset},'↩ Reset')
    ),
    h('div',{className:'pe-hint'},'A parte dentro do círculo será salva como sua foto de perfil'),
    h('div',{className:'mdl-ft'},
      h('button',{className:'btn btn-ghost',onClick:onCancel},'Cancelar'),
      h('button',{className:'btn btn-primary',onClick:confirm},'✓ Usar esta foto')
    )
  )
}

function getRank(totalPts){return RANKS.slice().reverse().find(r=>totalPts>=r.min)||RANKS[0]}
function getWeekTier(score){return WEEK_TIERS.find(t=>score>=t.min)||WEEK_TIERS[4]}
function getWeekNum(){
  const now=new Date();const jan1=new Date(now.getFullYear(),0,1);
  return{week:Math.ceil(((now-jan1)/86400000+jan1.getDay()+1)/7),year:now.getFullYear()};
}
function rankProgress(pts){
  const r=getRank(pts);
  if(r.max===Infinity)return{pct:100,next:0,label:'Rank máximo atingido'};
  const range=r.max-r.min+1;
  const progress=pts-r.min;
  const pct=Math.min(100,Math.round(progress/range*100));
  const next=r.max+1-pts;
  const nextRank=getRank(r.max+1);
  return{pct,next,label:next+'pts para '+nextRank.name};
}

// ─── CHECKIN DATA HOOK ───
function useCheckins(userId){
  const[checkins,sc]=useState([]);
  const[invites,si]=useState([]);
  const[loading,sl]=useState(false);

  const load=useCallback(async()=>{
    if(!SB||!userId)return;
    sl(true);
    const[cr,ir]=await Promise.all([
      SB.from('checkins').select('*').order('created_at',{ascending:false}).limit(2000),
      SB.from('checkin_invites').select('*').eq('user_id',userId).order('sent_at',{ascending:false}).limit(500)
    ]);
    sc(cr.data||[]);
    si(ir.data||[]);
    sl(false);
  },[userId]);

  useEffect(()=>{load();},[load]);

  return{checkins,invites,loading,reload:load,
    async logInvite(patientId,weekNumber,year){
      await SB.from('checkin_invites').upsert(
        {user_id:userId,patient_id:patientId,week_number:weekNumber,year,sent_at:new Date().toISOString()},
        {onConflict:'patient_id,week_number,year'}
      );
      await load();
    }
  };
}

// ─── SCORE CALC ───
function calcPatientTotal(allCheckins,invites){
  const baseScore=allCheckins.reduce((s,c)=>s+(c.lapidados_score||0),0);
  const now=new Date();
  const penaltyCount=invites.filter(inv=>{
    const sentAt=new Date(inv.sent_at);
    const daysSince=Math.floor((now-sentAt)/86400000);
    if(daysSince<PENALTY_DAYS)return false;
    const hasCheckin=allCheckins.some(c=>c.week_number===inv.week_number&&c.year===inv.year);
    return !hasCheckin;
  }).length;
  return Math.max(0,baseScore-(penaltyCount*PENALTY_PTS));
}
