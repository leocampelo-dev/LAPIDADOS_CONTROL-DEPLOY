// ─── MAIN CHECKIN HUB ───
function CheckinHub({pats,db}){
  const{checkins,invites,loading,reload,logInvite}=useCheckins(db._userId);
  const[showRankInfo,setShowRankInfo]=useState(false);
  const[selectedPat,setSelectedPat]=useState(null);
  const[search,setSearch]=useState('');
  const[filter,setFilter]=useState('all');
  const[rankUp,setRankUp]=useState(null);
  const{week,year}=getWeekNum();

  const checkinByPat=useMemo(()=>{
    const m={};checkins.forEach(c=>{if(!m[c.patient_id])m[c.patient_id]=[];m[c.patient_id].push(c);});return m;
  },[checkins]);
  const weekCheckinByPat=useMemo(()=>{
    const m={};checkins.forEach(c=>{if(c.week_number===week&&c.year===year)m[c.patient_id]=c;});return m;
  },[checkins,week,year]);
  const invitesByPat=useMemo(()=>{
    const m={};invites.forEach(i=>{if(!m[i.patient_id])m[i.patient_id]=[];m[i.patient_id].push(i);});return m;
  },[invites]);

  const enriched=pats.map(p=>{
    const all=checkinByPat[p.id]||[];
    const patInvites=invitesByPat[p.id]||[];
    const totalPts=calcPatientTotal(all,patInvites);
    return{...p,weekCheckin:weekCheckinByPat[p.id]||null,allCheckins:all,patInvites,totalPts,hasThisWeek:!!weekCheckinByPat[p.id]};
  }).sort((a,b)=>b.totalPts-a.totalPts);

  const filtered=search?enriched.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())):enriched;
  const pending=filtered.filter(p=>!p.hasThisWeek);
  const done=filtered.filter(p=>p.hasThisWeek).sort((a,b)=>(b.weekCheckin?.lapidados_score||0)-(a.weekCheckin?.lapidados_score||0));
  const displayed=filter==='pending'?pending:filter==='done'?done:filtered;

  const totalDone=done.length;
  const avgScore=done.length?Math.round(done.reduce((s,p)=>s+(p.weekCheckin?.lapidados_score||0),0)/done.length):0;

  const getSentKey=(pid)=>'lc_sent_'+pid+'_'+week+'_'+year;
  const wasSentThisWeek=(pid)=>{
    const k=getSentKey(pid);const v=localStorage.getItem(k);
    if(!v)return false;
    const d=Math.floor((Date.now()-parseInt(v))/86400000);
    return d<6;
  };
  const markSent=(pid)=>localStorage.setItem(getSentKey(pid),Date.now());

  const handleSendWA=async(p)=>{
    const profName=db.profile?.fullName?.split(' ')[0]||'Leo';
    const link=CHECKIN_URL+'?patient_id='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(p.name.split(' ')[0]);
    const msg='Oi '+p.name.split(' ')[0]+'! 💪 Hora do seu Check-in semanal do Lapidados Club!\n\nResponde rapidinho e veja sua pontuação e RANK na gamificação 🎮🔥\n\n'+link;
    const prevTotal=p.totalPts;
    await logInvite(p.id,week,year).catch(()=>{});
    markSent(p.id);
    const phone='55'+p.phone.replace(/\D/g,'');
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  };

  return h('div',null,
    rankUp&&h(RankUpOverlay,{rank:rankUp,onClose:()=>setRankUp(null)}),
    h('div',{className:'pg-head'},
      h('div',null,
        h('div',{className:'pg-title'},'Check-in · Lapidados'),
        h('div',{className:'pg-sub'},'Semana '+week+' · '+year+' · '+totalDone+'/'+pats.length+' respondidos')
      ),
      h('button',{className:'btn btn-ghost btn-sm',onClick:reload},'↻ Atualizar')
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:10,marginBottom:20}},
      h('div',{className:'kpi or'},h('div',{className:'kpi-icon'},'📲'),h('div',{className:'kpi-v'},pats.length),h('div',{className:'kpi-l'},'Total alunos')),
      h('div',{className:'kpi gr'},h('div',{className:'kpi-icon'},'✅'),h('div',{className:'kpi-v'},totalDone),h('div',{className:'kpi-l'},'Responderam')),
      h('div',{className:'kpi re'},h('div',{className:'kpi-icon'},'⏳'),h('div',{className:'kpi-v'},pending.length),h('div',{className:'kpi-l'},'Pendentes')),
      h('div',{className:'kpi bl'},h('div',{className:'kpi-icon'},'📊'),h('div',{className:'kpi-v'},avgScore||'—'),h('div',{className:'kpi-l'},'Score médio'))
    ),
h('div',{style:{background:'var(--ink7)',border:'1px solid var(--ink6)',borderRadius:'var(--radius-lg)',padding:'14px 18px',marginBottom:18,cursor:'pointer'},
      onClick:()=>setShowRankInfo(ri=>!ri)},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        h('div',{style:{fontSize:13,fontWeight:700}},'📊 Sistema de pontuação'),
        h('span',{style:{fontSize:11,color:'var(--ink3)'}},showRankInfo?'▲ Fechar':'▼ Ver detalhes')
      ),
      showRankInfo&&h('div',{style:{marginTop:12}},
        h('div',{style:{fontSize:12,color:'var(--ink3)',marginBottom:10}},'Score semanal máximo: 100pts · Acumule pontos para subir de rank'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}},
          [['🥗','Dieta','25pts'],['🏋️','Treino','20pts'],['⚡','Energia','15pts'],
           ['🏃','Cardio','10pts'],['🍽️','Aderência','10pts'],['😴','Sono','10pts'],
           ['🫁','Intestino','5pts'],['😋','Saciedade','5pts']].map(([ic,lb,pt])=>
            h('div',{key:lb,style:{display:'flex',alignItems:'center',gap:6,padding:'5px 8px',background:'var(--w)',borderRadius:7,border:'1px solid var(--ink6)'}},
              h('span',{style:{fontSize:13}},ic),

          )
        ),
        h('div',{style:{marginTop:10,display:'grid',gridTemplateColumns:'1fr',gap:4}},
          RANKS.map(r=>h('div',{key:r.id,style:{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:8,border:'1px solid var(--ink6)',background:'var(--w)'}},
            h('span',{style:{fontSize:16}},r.icon),
            h('span',{style:{fontSize:11,fontWeight:700,flex:1}},r.name),

          ))
        ),
        h('div',{style:{marginTop:8,fontSize:11,color:'var(--ink3)',padding:'8px 10px',background:'var(--r1)',borderRadius:7}},
          '⚠️ Semanas com link enviado sem resposta em 6 dias = −10pts do acumulado'
        )
      )
    ),
    h('div',{className:'tbar',style:{marginBottom:12}},
      h('div',{className:'srch'},h('span',{className:'srch-ic'},'⌕'),h('input',{placeholder:'Buscar aluno...',value:search,onChange:e=>setSearch(e.target.value)})),
      h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
      [['all','Todos'],['pending','Pendentes ⏳'],['done','Responderam ✅']].map(([v,l])=>

    h('div',{className:'tw'},h('table',null,

  const{week,year}=getWeekNum();
  const weekDone=new Set(checkins.filter(c=>c.week_number===week&&c.year===year).map(c=>c.patient_id));
  const done=weekDone.size;
  const pending=Math.max(0,pats.length-done);
  const avgScore=done>0?Math.round(checkins.filter(c=>c.week_number===week&&c.year===year).reduce((s,c)=>s+(c.lapidados_score||0),0)/done):0;
  return h('div',{className:'ac-dash-card'},
    h('div',{className:'ac-dash-title'},'📲 Check-in · Semana atual'),
    h('div',{className:'ac-dash-stats'},
      h('div',{className:'ac-dash-stat hot'},h('div',{className:'ac-dash-num'},pending),h('div',{className:'ac-dash-lbl'},'Pendentes')),
      h('div',{className:'ac-dash-stat cool'},h('div',{className:'ac-dash-num'},done),h('div',{className:'ac-dash-lbl'},'Responderam')),
      h('div',{className:'ac-dash-stat warm'},h('div',{className:'ac-dash-num'},avgScore||'—'),h('div',{className:'ac-dash-lbl'},'Score médio'))
    ),
    h('button',{
      className:'btn btn-primary',
      style:{width:'100%',justifyContent:'center',fontSize:13},
      onClick:()=>onNav('checkin')
    },'Ver Check-in completo →')
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
